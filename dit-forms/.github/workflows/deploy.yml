name: Deploy to Production

on:
  workflow_run:
    workflows: ["DIT Forms CI/CD"]
    types:
      - completed
    branches: [ main ]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./dit-forms
          file: ./dit-forms/Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./dit-forms/frontend-react
          file: ./dit-forms/frontend-react/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/dit-forms
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm backend python app/scripts/migrate_version_status.py
            docker compose -f docker-compose.prod.yml up -d --force-recreate
            docker image prune -f

      - name: Run Post-Deployment Smoke Tests
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/dit-forms
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T \
              -e SMOKE_TEST_BASE_URL=http://localhost \
              -e SMOKE_ADMIN_EMAIL=${{ secrets.SMOKE_ADMIN_EMAIL }} \
              -e SMOKE_ADMIN_PASSWORD=${{ secrets.SMOKE_ADMIN_PASSWORD }} \
              backend python app/scripts/smoke_test.py
