<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Representatives - DIT Forms</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h1>DIT Forms</h1>
      <nav id="sidebar-nav"></nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h2>Class Representatives</h2>
        <div class="user-info" id="user-info"></div>
      </div>

      <div id="alert-box"></div>

      <div class="card">
        <h3>Create Class Representative</h3>
        <form id="create-rep-form">
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="rep-email" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Temporary Password</label>
              <input type="text" id="rep-password" class="form-control" required>
              <small class="text-muted">Will be shown once after creation</small>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Program Class ID</label>
              <input type="text" id="rep-programClass" class="form-control" placeholder="e.g., DIT-2026-A" required>
            </div>
            <div class="form-group">
              <label>Term ID</label>
              <input type="text" id="rep-term" class="form-control" placeholder="e.g., 2026-S1" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="create-btn">Create Class Rep</button>
        </form>
      </div>

      <div class="card">
        <h3>Existing Class Representatives</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Assigned Scopes</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="reps-tbody">
              <tr><td colspan="5" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    let currentUser = null;

    (async () => {
      currentUser = await auth.requireLogin();
      if (!currentUser) return;

      if (currentUser.role !== "admin") {
        alert("Access denied. Admins only.");
        window.location.href = "/admin/dashboard.html";
        return;
      }

      auth.renderTopbar(currentUser);
      auth.renderSidebar("class-reps", currentUser);
      loadClassReps();
    })();

    async function loadClassReps() {
      const tbody = document.getElementById("reps-tbody");
      tbody.innerHTML = '<tr><td colspan="5" class="text-center">Loading...</td></tr>';

      try {
        const allUsers = await api.get("/admin/users");
        const classReps = allUsers.filter((u) => u.role === "class_rep");

        if (classReps.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No class reps yet</td></tr>';
          return;
        }

        tbody.innerHTML = classReps.map((rep) => `
          <tr>
            <td>${utils.escapeHtml(rep.email)}</td>
            <td>
              ${(rep.assignedClassTerms || []).map((scope) =>
                `<span class="badge badge-info" style="margin:0.125rem;">${utils.escapeHtml(scope.programClassId)} / ${utils.escapeHtml(scope.termId)}</span>`
              ).join("") || '<span class="text-muted">No scopes assigned</span>'}
            </td>
            <td><span class="badge badge-${rep.status === "active" ? "success" : "danger"}">${rep.status}</span></td>
            <td>${utils.formatDate(rep.createdAt)}</td>
            <td>
              <button class="btn btn-sm btn-${rep.status === "active" ? "warning" : "success"}"
                      onclick="toggleRepStatus('${rep.id}', '${rep.status}')">
                ${rep.status === "active" ? "Disable" : "Enable"}
              </button>
              <button class="btn btn-sm btn-secondary" onclick="addScope('${rep.id}')">Add Scope</button>
            </td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Error: ${err.message}</td></tr>`;
      }
    }

    document.getElementById("create-rep-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("create-btn");
      utils.setLoading(btn, true);

      try {
        const newRep = await api.post("/admin/users/class-rep", {
          email: document.getElementById("rep-email").value,
          password: document.getElementById("rep-password").value,
          assignedClassTerms: [
            {
              programClassId: document.getElementById("rep-programClass").value.trim(),
              termId: document.getElementById("rep-term").value.trim(),
            },
          ],
        });

        utils.showAlert(
          "alert-box",
          `Class Rep created!\nEmail: ${newRep.email}\nPassword: ${document.getElementById("rep-password").value}\n\nShare these credentials securely!`,
          "success"
        );

        e.target.reset();
        loadClassReps();
      } catch (err) {
        utils.showAlert("alert-box", "Failed: " + err.message, "danger");
      } finally {
        utils.setLoading(btn, false);
      }
    });

    async function toggleRepStatus(userId, currentStatus) {
      if (!(await utils.confirmAction(`Are you sure you want to ${currentStatus === "active" ? "disable" : "enable"} this class rep?`))) return;

      try {
        await api.patch(`/admin/users/${userId}`, {
          status: currentStatus === "active" ? "disabled" : "active",
        });
        loadClassReps();
      } catch (err) {
        alert("Failed: " + err.message);
      }
    }

    async function addScope(userId) {
      const programClassId = prompt("Enter Program Class ID:");
      if (!programClassId) return;
      const termId = prompt("Enter Term ID:");
      if (!termId) return;

      try {
        await api.post(`/admin/users/${userId}/scopes`, {
          programClassId: programClassId.trim(),
          termId: termId.trim(),
        });
        loadClassReps();
      } catch (err) {
        alert("Failed: " + err.message);
      }
    }
  </script>
</body>
</html>
