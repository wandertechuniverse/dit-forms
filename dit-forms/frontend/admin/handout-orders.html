<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handout Orders - DIT Forms</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h1>DIT Forms</h1>
      <nav id="sidebar-nav"></nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h2>Handout Orders (Invoices)</h2>
        <div class="user-info" id="user-info"></div>
      </div>

      <!-- Filters -->
      <div class="card">
        <h3>Filters</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Invoice Status</label>
            <select id="filter-status" class="form-control">
              <option value="">All</option>
              <option value="unpaid">Unpaid</option>
              <option value="partially_paid">Partially Paid</option>
              <option value="paid">Paid</option>
            </select>
          </div>
          <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="filter-student" class="form-control" placeholder="Matched student ID">
          </div>
        </div>
        <button class="btn btn-primary" onclick="loadOrders()">Apply</button>
      </div>

      <!-- Orders Table -->
      <div class="card">
        <div class="flex-between mb-2">
          <h3>All Orders <span id="total-count" class="text-muted"></span></h3>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Given Out</th>
                <th>Lines</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="orders-tbody">
              <tr><td colspan="6" class="text-center">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Order Detail Modal -->
  <div id="detail-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:100;overflow-y:auto;padding:2rem;">
    <div class="card" style="width:600px;max-width:95vw;max-height:90vh;overflow-y:auto;">
      <div class="flex-between mb-2">
        <h3>Order Details</h3>
        <button class="btn btn-sm btn-secondary" onclick="closeModal()">Close</button>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    let currentScope = {};
    let ordersCache = {};

    (async () => {
      const user = await auth.requireLogin();
      if (!user) return;
      auth.renderTopbar(user);
      auth.renderSidebar("handouts", user);

      currentScope = getScope();
      if (!currentScope.programClassId || !currentScope.termId) {
        alert("Please select a scope on the Dashboard first.");
        window.location.href = "/admin/dashboard.html";
        return;
      }
      loadOrders();
    })();

    async function loadOrders() {
      const tbody = document.getElementById("orders-tbody");
      tbody.innerHTML = '<tr><td colspan="6" class="text-center">Loading...</td></tr>';

      const status = document.getElementById("filter-status").value;
      const studentId = document.getElementById("filter-student").value.trim();

      let url = "/handout-orders?programClassId=" + currentScope.programClassId + "&termId=" + currentScope.termId;
      if (status) url += "&invoiceStatus=" + status;
      if (studentId) url += "&studentId=" + studentId;

      try {
        const res = await api.get(url);
        document.getElementById("total-count").textContent = "(" + res.total + ")";

        if (res.orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No orders found</td></tr>';
          return;
        }

        ordersCache = {};
        const statusBadge = { unpaid: 'danger', partially_paid: 'warning', paid: 'success' };
        tbody.innerHTML = res.orders.map(o => {
          ordersCache[o.id] = o;
          const badge = statusBadge[o.invoice.invoiceStatus] || 'info';
          return '<tr>' +
            '<td><strong>' + utils.escapeHtml(o.student.fullNameSnapshot) + '</strong><br>' +
            '<small class="text-muted"><code>' + utils.escapeHtml(o.student.idNumberSnapshot) + '</code></small></td>' +
            '<td>' + utils.formatDate(o.givenOutAt) + '</td>' +
            '<td>' + o.lines.length + ' item(s)</td>' +
            '<td><strong>' + utils.formatMoney(o.invoice.totalAmount) + '</strong></td>' +
            '<td><span class="badge badge-' + badge + '">' + o.invoice.invoiceStatus + '</span></td>' +
            '<td>' +
            '<button class="btn btn-sm btn-primary" onclick="viewOrder(\'' + o.id + '\')">View</button> ' +
            '<a href="/admin/payments.html?orderId=' + o.id + '" class="btn btn-sm btn-success">Pay</a>' +
            '</td></tr>';
        }).join("");
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Error: ' + err.message + '</td></tr>';
      }
    }

    function viewOrder(orderId) {
      const order = ordersCache[orderId];
      if (!order) return;
      const statusBadge = { unpaid: 'danger', partially_paid: 'warning', paid: 'success' };
      const badge = statusBadge[order.invoice.invoiceStatus] || 'info';
      let html = "<p><strong>Order ID:</strong> <code>" + order.id + "</code></p>" +
        "<p><strong>Student:</strong> " + utils.escapeHtml(order.student.fullNameSnapshot) + " (<code>" + utils.escapeHtml(order.student.idNumberSnapshot) + "</code>)</p>" +
        "<p><strong>Given Out:</strong> " + utils.formatDate(order.givenOutAt) + "</p>" +
        "<p><strong>Status:</strong> <span class=\"badge badge-" + badge + "\">" + order.invoice.invoiceStatus + "</span></p>" +
        "<p><strong>Total:</strong> " + utils.formatMoney(order.invoice.totalAmount) + "</p>" +
        '<h4 class="mt-2">Line Items</h4>' +
        '<table><thead><tr><th>Course</th><th>Item</th><th>Qty</th><th>Unit Price</th><th>Total</th></tr></thead><tbody>';
      order.lines.forEach(l => {
        html += "<tr><td>" + utils.escapeHtml(l.courseId) + "</td><td>" + utils.escapeHtml(l.handoutItemId) + "</td><td>" + l.qty + "</td><td>" + utils.formatMoney(l.unitPrice) + "</td><td>" + utils.formatMoney(l.lineTotal) + "</td></tr>";
      });
      html += '</tbody></table>' +
        '<div class="mt-2">' +
        '<a href="/admin/payments.html?orderId=' + order.id + '" class="btn btn-success">Record Payment</a> ' +
        '<a href="/admin/submission-detail.html?id=' + order.formSubmissionId + '" class="btn btn-secondary">View Submission</a>' +
        '</div>';
      document.getElementById("detail-content").innerHTML = html;
      document.getElementById("detail-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("detail-modal").classList.add("hidden");
    }
  </script>
</body>
</html>
