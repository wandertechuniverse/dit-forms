<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Builder - DIT Forms</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .field-card{background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-bottom:1rem}
    .field-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
    .field-type-badge{background:#3182ce;color:#fff;padding:0.15rem 0.5rem;border-radius:12px;font-size:0.7rem}
    .options-list{margin-top:0.5rem}
    .option-row{display:flex;gap:0.5rem;margin-bottom:0.25rem}
    .option-row input{flex:1}
    .schema-preview{background:#1a202c;color:#68d391;padding:1rem;border-radius:8px;font-family:monospace;font-size:0.8rem;max-height:400px;overflow:auto;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h1>DIT Forms</h1>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <h2 id="form-title">Form Builder</h2>
        <div class="user-info" id="user-info"></div>
      </div>
      <div id="alert-box"></div>
      <div class="card" id="form-info-card" style="display:none;">
        <h3>Form Information</h3>
        <div id="form-info"></div>
      </div>
      <div class="card">
        <div class="flex-between mb-2">
          <h3>Build Form Fields</h3>
          <button class="btn btn-success" onclick="addField()">+ Add Field</button>
        </div>
        <p class="text-muted mb-2"><strong>Note:</strong> "Full Name" and "ID Number" are automatically included as base fields.</p>
        <div id="fields-container"></div>
        <div class="mt-2">
          <button class="btn btn-primary" onclick="saveAsNewVersion()" id="save-btn">Save as New Version</button>
          <button class="btn btn-secondary" onclick="showPreview()">Preview Schema</button>
        </div>
      </div>
      <div class="card" id="preview-card" style="display:none;">
        <h3>Schema Preview (JSON)</h3>
        <pre class="schema-preview" id="schema-preview"></pre>
      </div>
      <div class="card">
        <h3>Version History</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Version</th><th>Status</th><th>Fields</th><th>Created</th></tr></thead>
            <tbody id="versions-tbody"><tr><td colspan="4" class="text-center text-muted">No versions yet</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    let formId=null,formDef=null,fields=[],fieldCounter=0;
    (async()=>{
      const user=await auth.requireLogin();if(!user)return;
      auth.renderTopbar(user);auth.renderSidebar("forms");
      const params=new URLSearchParams(window.location.search);
      formId=params.get("formId");
      if(!formId){alert("No form ID provided");window.location.href="/admin/forms.html";return;}
      await loadForm();
    })();
    async function loadForm(){
      try{
        const d=await api.get(`/forms/${formId}`);formDef=d;
        document.getElementById("form-title").textContent=`Builder: ${d.name}`;
        document.getElementById("form-info").innerHTML=`<p><strong>Name:</strong> ${utils.escapeHtml(d.name)}</p><p><strong>Type:</strong> <span class="badge badge-${d.formType==='handout_tracker'?'warning':'info'}">${d.formType}</span></p><p><strong>Scope:</strong> ${utils.escapeHtml(d.programClassId)} / ${utils.escapeHtml(d.termId)}</p>`;
        document.getElementById("form-info-card").style.display="block";
        if(d.versions&&d.versions.length>0){const active=d.versions.find(v=>v.isActive)||d.versions[0];if(active.schema&&active.schema.fields){fields=active.schema.fields;renderFields();}}
        renderVersions(d.versions||[]);
      }catch(e){utils.showAlert("alert-box","Failed to load form: "+e.message,"danger");}
    }
    function renderVersions(v){
      const t=document.getElementById("versions-tbody");
      if(!v.length){t.innerHTML='<tr><td colspan="4" class="text-center text-muted">No versions yet</td></tr>';return;}
      t.innerHTML=v.map(x=>`<tr><td><strong>v${x.versionNumber}</strong></td><td><span class="badge badge-${x.isActive?'success':'secondary'}">${x.isActive?'Active':'Inactive'}</span></td><td>${(x.schema.fields||[]).length} fields</td><td>${utils.formatDate(x.createdAt)}</td></tr>`).join("");
    }
    function addField(){fieldCounter++;fields.push({key:`field_${fieldCounter}`,label:`New Field ${fieldCounter}`,type:"text",required:false,options:[],accept:"",maxFiles:1,placeholder:"",helpText:""});renderFields();}
    function removeField(i){fields.splice(i,1);renderFields();}
    function renderFields(){
      const c=document.getElementById("fields-container");
      if(!fields.length){c.innerHTML='<p class="text-muted text-center">No fields yet. Click "Add Field" to start.</p>';return;}
      c.innerHTML=fields.map((f,i)=>`<div class="field-card"><div class="field-header"><div><strong>${utils.escapeHtml(f.label)}</strong> <span class="field-type-badge">${f.type}</span>${f.required?' <span class="badge badge-danger" style="margin-left:0.25rem;">required</span>':''}</div><button class="btn btn-sm btn-danger" onclick="removeField(${i})">Remove</button></div><div class="form-row"><div class="form-group"><label>Field Key</label><input type="text" class="form-control" value="${utils.escapeHtml(f.key)}" onchange="updateField(${i},'key',this.value)"></div><div class="form-group"><label>Label</label><input type="text" class="form-control" value="${utils.escapeHtml(f.label)}" onchange="updateField(${i},'label',this.value)"></div></div><div class="form-row"><div class="form-group"><label>Type</label><select class="form-control" onchange="updateField(${i},'type',this.value);renderFields();"><option value="text" ${f.type==='text'?'selected':''}>Text</option><option value="number" ${f.type==='number'?'selected':''}>Number</option><option value="textarea" ${f.type==='textarea'?'selected':''}>Textarea</option><option value="select" ${f.type==='select'?'selected':''}>Select</option><option value="date" ${f.type==='date'?'selected':''}>Date</option><option value="file" ${f.type==='file'?'selected':''}>File Upload</option></select></div><div class="form-group"><label>Required?</label><select class="form-control" onchange="updateField(${i},'required',this.value==='true')"><option value="false" ${!f.required?'selected':''}>No</option><option value="true" ${f.required?'selected':''}>Yes</option></select></div></div>${f.type==='select'?renderOptions(i,f):''}${f.type==='file'?`<div class="form-row"><div class="form-group"><label>Accept</label><input type="text" class="form-control" value="${utils.escapeHtml(f.accept||'')}" onchange="updateField(${i},'accept',this.value)"></div><div class="form-group"><label>Max Files</label><input type="number" class="form-control" min="1" value="${f.maxFiles||1}" onchange="updateField(${i},'maxFiles',parseInt(this.value))"></div></div>`:''}</div>`).join("");
    }
    function renderOptions(i,f){const o=f.options||[];return`<div class="form-group"><label>Options</label><div class="options-list">${o.map((x,oi)=>`<div class="option-row"><input type="text" placeholder="Label" value="${utils.escapeHtml(x.label)}" onchange="updateOption(${i},${oi},'label',this.value)"><input type="text" placeholder="Value" value="${utils.escapeHtml(x.value)}" onchange="updateOption(${i},${oi},'value',this.value)"><button class="btn btn-sm btn-danger" onclick="removeOption(${i},${oi})">×</button></div>`).join("")}</div><button class="btn btn-sm btn-secondary mt-1" onclick="addOption(${i})">+ Add Option</button></div>`;}
    function updateField(i,k,v){fields[i][k]=v;if(k==='label'){fields[i].key=v.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');renderFields();}}
    function addOption(i){if(!fields[i].options)fields[i].options=[];fields[i].options.push({label:"Option",value:"option_value"});renderFields();}
    function removeOption(i,oi){fields[i].options.splice(oi,1);renderFields();}
    function updateOption(i,oi,k,v){fields[i].options[oi][k]=v;}
    function buildSchema(){return{fields:fields.map(f=>{const c={key:f.key,label:f.label,type:f.type,required:f.required};if(f.placeholder)c.placeholder=f.placeholder;if(f.helpText)c.helpText=f.helpText;if(f.type==='select')c.options=f.options||[];if(f.type==='file'){c.accept=f.accept||"";c.maxFiles=f.maxFiles||1;}return c;})};}
    function showPreview(){document.getElementById("schema-preview").textContent=JSON.stringify(buildSchema(),null,2);document.getElementById("preview-card").style.display="block";}
    async function saveAsNewVersion(){
      if(!fields.length){utils.showAlert("alert-box","Please add at least one field","danger");return;}
      const keys=fields.map(f=>f.key);if(new Set(keys).size!==keys.length){utils.showAlert("alert-box","Field keys must be unique","danger");return;}
      const btn=document.getElementById("save-btn");utils.setLoading(btn,true);
      try{await api.post(`/forms/${formId}/versions`,{schema:buildSchema()});utils.showAlert("alert-box","New version saved!","success");await loadForm();}catch(e){utils.showAlert("alert-box","Failed: "+e.message,"danger");}finally{utils.setLoading(btn,false);}
    }
  </script>
</body>
</html>
