<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Submission Detail - DIT Forms</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h1>DIT Forms</h1>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main class="main-content">
      <div class="topbar">
        <h2>Submission Detail</h2>
        <div class="user-info" id="user-info"></div>
      </div>
      <div id="alert-box"></div>
      <div id="content" style="display:none;">
        <div class="card"><h3>Student Information</h3><div id="student-info"></div></div>
        <div class="card"><h3>Submission Answers</h3><div id="answers-container"></div></div>
        <div class="card" id="files-card" style="display:none;">
          <h3>Attached Files</h3>
          <div class="table-wrap">
            <table><thead><tr><th>Field</th><th>File Name</th><th>Size</th><th>Type</th><th>Uploaded</th><th>Action</th></tr></thead><tbody id="files-tbody"></tbody></table>
          </div>
        </div>
        <div class="card" id="handout-card" style="display:none;"><h3>Linked Handout Order</h3><div id="handout-info"></div></div>
      </div>
      <div class="mt-2"><a href="/admin/submissions.html" class="btn btn-secondary">Back to Submissions</a></div>
    </main>
  </div>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    let submission=null,formDef=null,formVersion=null;
    (async()=>{
      const user=await auth.requireLogin();if(!user)return;
      auth.renderTopbar(user);auth.renderSidebar("submissions");
      const params=new URLSearchParams(window.location.search);
      const id=params.get("id");
      if(!id){alert("No submission ID");window.location.href="/admin/submissions.html";return;}
      try{
        submission=await api.get(`/submissions/${id}`);
        const versionRes=await api.get(`/forms/${submission.formDefinitionId}`);
        formDef=versionRes;formVersion=versionRes.versions.find(v=>v.id===submission.formVersionId);
        renderAll();document.getElementById("content").style.display="block";
        try{const orders=await api.get(`/handout-orders?programClassId=${submission.programClassId}&termId=${submission.termId}`);const order=orders.orders.find(o=>o.formSubmissionId===submission.id);if(order)renderHandoutOrder(order);}catch(e){}
        loadFiles();
      }catch(e){utils.showAlert("alert-box","Failed to load: "+e.message,"danger");}
    })();
    function renderAll(){
      document.getElementById("student-info").innerHTML=`<p><strong>Name:</strong> ${utils.escapeHtml(submission.studentMatch.fullNameSnapshot)}</p><p><strong>ID Number:</strong> <code>${utils.escapeHtml(submission.studentMatch.idNumberSnapshot)}</code></p><p><strong>Matched:</strong> ${submission.studentMatch.matchedStudentId?'Yes':'Not in list'}</p><p><strong>Submitted:</strong> ${utils.formatDate(submission.submittedAt)}</p><p><strong>Form:</strong> ${utils.escapeHtml(formDef.name)} (v${formVersion?.versionNumber||'?'})</p><p><strong>Status:</strong> <span class="badge badge-info">${submission.status}</span></p>`;
      const answers=submission.answers||{};const schemaFields=formVersion?.schema?.fields||[];const container=document.getElementById("answers-container");
      const fieldMap={};schemaFields.forEach(f=>fieldMap[f.key]=f);
      const rows=Object.entries(answers).map(([key,value])=>{
        const field=fieldMap[key];const label=field?field.label:key;let dv;
        if(Array.isArray(value)){if(value.length>0&&typeof value[0]==='string'&&value.length===24)dv=`<em>${value.length} file(s) attached</em>`;else if(field?.type==='select'&&field.options)dv=value.map(v=>{const o=field.options.find(x=>x.value===v);return o?o.label:v;}).join(", ");else dv=JSON.stringify(value);}
        else if(field?.type==='select'&&field.options){const o=field.options.find(x=>x.value===value);dv=o?o.label:value;}
        else if(typeof value==='object'&&value!==null&&Array.isArray(value))dv=renderHandoutLines(value);
        else dv=utils.escapeHtml(String(value??'—'));
        return`<div style="padding:0.5rem 0;border-bottom:1px solid #e2e8f0;"><strong>${utils.escapeHtml(label)}</strong><div class="mt-1">${dv}</div></div>`;
      });
      container.innerHTML=rows.length?rows.join(""):'<p class="text-muted">No answers</p>';
    }
    function renderHandoutLines(lines){if(!Array.isArray(lines)||!lines.length)return'—';let h='<table style="margin-top:0.5rem;"><thead><tr><th>Course</th><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>';let g=0;lines.forEach(l=>{const t=(l.qty||0)*(l.unitPrice||0);g+=t;h+=`<tr><td>${utils.escapeHtml(l.courseId||'—')}</td><td>${utils.escapeHtml(l.handoutItemId||'—')}</td><td>${l.qty}</td><td>${utils.formatMoney(l.unitPrice||0)}</td><td>${utils.formatMoney(t)}</td></tr>`;});h+=`</tbody><tfoot><tr><td colspan="4" style="text-align:right;"><strong>Total:</strong></td><td><strong>${utils.formatMoney(g)}</strong></td></tr></tfoot></table>`;return h;}
    async function loadFiles(){try{const files=await api.get(`/submissions/${submission.id}/files`);if(!files.length)return;document.getElementById("files-card").style.display="block";document.getElementById("files-tbody").innerHTML=files.map(f=>`<tr><td>${utils.escapeHtml(f.fieldKey)}</td><td>${utils.escapeHtml(f.fileName)}</td><td>${(f.sizeBytes/1024).toFixed(1)} KB</td><td>${utils.escapeHtml(f.contentType)}</td><td>${utils.formatDate(f.uploadedAt)}</td><td><button class="btn btn-sm btn-primary" onclick="downloadFile('${f.id}')">Download</button></td></tr>`).join("");}catch(e){}}
    async function downloadFile(fileId){try{const res=await api.get(`/files/${fileId}/download`);window.open(res.downloadUrl,"_blank");}catch(e){alert("Failed: "+e.message);}}
    function renderHandoutOrder(order){document.getElementById("handout-card").style.display="block";const b={unpaid:'danger',partially_paid:'warning',paid:'success'}[order.invoice.invoiceStatus]||'info';document.getElementById("handout-info").innerHTML=`<p><strong>Order ID:</strong> <code>${order.id}</code></p><p><strong>Status:</strong> <span class="badge badge-${b}">${order.invoice.invoiceStatus}</span></p><p><strong>Total:</strong> ${utils.formatMoney(order.invoice.totalAmount)}</p><div class="mt-2"><a href="/admin/payments.html?orderId=${order.id}" class="btn btn-sm btn-success">Record Payment</a></div>`;}
  </script>
</body>
</html>
