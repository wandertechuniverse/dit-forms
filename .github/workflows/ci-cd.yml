name: DIT Forms CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt pytest requests httpx

      - name: Install Frontend Dependencies
        working-directory: frontend-react
        run: |
          if [ ! -f bun.lock ]; then
            bun install
          else
            bun install --frozen-lockfile || {
              echo "Frozen install failed, regenerating..."
              rm -rf node_modules
              bun install
            }
          fi

      - name: Run E2E Tests
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: dit_forms_ci
          JWT_SECRET: test-secret-for-ci
          JWT_EXPIRE_MINUTES: 60
        run: python app/scripts/e2e_test.py

      - name: Build Frontend
        run: cd frontend-react && bun run build
