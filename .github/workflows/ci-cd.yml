name: DIT Forms CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt pytest requests httpx
          cd frontend-react && bun install

      - name: Run E2E Tests
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: dit_forms_ci
          JWT_SECRET: test-secret-for-ci
          JWT_EXPIRE_MINUTES: 60
        run: python app/scripts/e2e_test.py

      - name: Build Frontend
        run: cd frontend-react && bun run build
