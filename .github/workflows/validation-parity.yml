name: Validation Parity Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  parity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt pytest httpx requests

      - name: Install Frontend Dependencies
        working-directory: frontend-react
        run: |
          if [ ! -f bun.lock ]; then
            echo "bun.lock missing — generating fresh lockfile"
            bun install
          else
            bun install --frozen-lockfile || {
              echo "Frozen install failed, regenerating..."
              rm -rf node_modules
              bun install
            }
          fi

      - name: Run Upload Parity Tests
        run: pytest tests/test_validation_parity.py -v --tb=short

      - name: Run Form Schema Parity Tests
        run: pytest tests/test_form_schema_parity.py -v --tb=short

      - name: Run Payment Parity Tests
        run: pytest tests/test_payment_parity.py -v --tb=short

      - name: Run Invoice Parity Tests
        run: pytest tests/test_invoice_parity.py -v --tb=short

      - name: Fail Build on Parity Drift
        if: failure()
        run: |
          echo "VALIDATION DRIFT DETECTED!"
          echo "Frontend/backend error messages no longer match."
          exit 1
